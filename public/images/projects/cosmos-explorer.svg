<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Cosmos Explorer 3D solar system">
  <defs>
    <radialGradient id="space" cx="22%" cy="30%" r="115%">
      <stop offset="0%" stop-color="#0a1430"/>
      <stop offset="45%" stop-color="#04081c"/>
      <stop offset="100%" stop-color="#00000a"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
