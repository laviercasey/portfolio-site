    <circle cx="170" cy="520" r="1.2" opacity="0.5"/>
    <circle cx="350" cy="600" r="1" opacity="0.35"/>
    <circle cx="540" cy="560" r="1.5" opacity="0.6"/>
    <circle cx="720" cy="610" r="1" opacity="0.4"/>
